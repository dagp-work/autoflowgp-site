[build]
  command = "npm run build"
  publish = "_site"

# Sécurité basique (optionnel)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirige domaine nu -> www (optionnel mais propre)
[[redirects]]
  from = "https://autoflowgp.com/*"
  to = "https://www.autoflowgp.com/:splat"
  status = 301
  force = true
